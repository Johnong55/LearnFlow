user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;

  log_format structured escape=json
    '{"timestamp":"$time_iso8601","requestId":"$request_id",'
    '"remoteAddress":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"upstreamDuration":"$upstream_response_time",'
    '"userAgent":"$http_user_agent"}';

  access_log /var/log/nginx/access.log structured;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  client_body_timeout 15s;
  client_header_timeout 15s;
  client_max_body_size 1m;
  reset_timedout_connection on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css text/plain;

  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_status 429;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

  include /etc/nginx/conf.d/*.conf;
}
