name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learnflow_ci
          POSTGRES_USER: learnflow_ci
          POSTGRES_PASSWORD: learnflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnflow_ci -d learnflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://learnflow_ci:learnflow_ci_password@localhost:5432/learnflow_ci?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-different-and-32-characters
      SEARCH_PROVIDER: mock
      LLM_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Integration tests
        run: npm run test:integration

      - name: End-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: Validate production configuration
        run: ./scripts/validate-production.sh .env.production.example

      - name: Build production image
        run: docker build --target production --tag learnflow-api:ci .
